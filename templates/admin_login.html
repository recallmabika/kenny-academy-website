<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin — {{ settings.school_name }}</title>
<link rel="icon" href="{{ url_for('static', filename='img/' ~ settings.logo) }}">
<script>
  (function () {
    var saved = localStorage.getItem('theme');
    var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
    if (dark) document.documentElement.classList.add('dark');
    else document.documentElement.classList.remove('dark');
  })();
</script>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        colors: {
          brand: { red: '#e10600', deep: '#a30500' },
          ink: { DEFAULT: '#141110' }
        },
        fontFamily: {
          serif: ['Fraunces', 'Georgia', 'serif'],
          mono: ['Space Mono', 'ui-monospace', 'monospace']
        }
      }
    }
  };
</script>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="min-h-screen flex items-center justify-center p-4 bg-[#faf8f6] text-[#141110] dark:bg-[#141110] dark:text-[#f5f0ee] font-mono">
<div class="w-full max-w-sm border border-black/10 dark:border-white/10 bg-white dark:bg-[#1c1613] p-8 shadow-xl">
  <div class="flex justify-between items-start mb-2">
    <h1 class="text-[22px] font-serif font-semibold text-ink dark:text-white leading-snug">{{ settings.school_name }}</h1>
    <a href="{{ url_for('home') }}" class="text-[11px] font-mono text-brand-red hover:underline">← Site</a>
  </div>
  <p class="text-[12.5px] text-ink/60 dark:text-white/60 mb-6">Sign in to manage site content.</p>
  {% if error %}
  <div class="border border-brand-red bg-brand-red/10 text-brand-red px-3 py-2 text-[12px] mb-4">{{ error }}</div>
  {% endif %}
  <form method="POST" class="space-y-4">
    <div>
      <label for="username" class="block text-[11px] uppercase tracking-wide opacity-60 mb-1">Username</label>
      <input id="username" name="username" type="text" required autofocus autocomplete="username"
             class="w-full border border-black/15 dark:border-white/20 bg-transparent px-3 py-2.5 text-[13px] text-ink dark:text-white focus:outline-none focus:border-brand-red">
    </div>
    <div>
      <label for="password" class="block text-[11px] uppercase tracking-wide opacity-60 mb-1">Password</label>
      <input id="password" name="password" type="password" required autocomplete="current-password"
             class="w-full border border-black/15 dark:border-white/20 bg-transparent px-3 py-2.5 text-[13px] text-ink dark:text-white focus:outline-none focus:border-brand-red">
    </div>
    <button type="submit"
            class="w-full bg-brand-red hover:bg-ink text-white dark:hover:bg-white dark:hover:text-ink py-3 text-[12px] font-bold tracking-widest uppercase transition-colors shadow-md">
      Sign in
    </button>
  </form>
</div>
</body>
</html>
