<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin — {{ settings.school_name }}</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="{{ url_for('static', filename='img/' ~ settings.logo) }}">
<!-- Dedicated theme script loaded before paint to prevent FOUT -->
<script src="{{ url_for('static', filename='js/theme.js') }}"></script>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="relative min-h-screen flex items-center justify-center p-4 bg-ink text-[#141110] dark:text-[#f5f0ee] font-mono overflow-hidden">
  <!-- Background Image with cinematic dark overlay -->
  <div class="absolute inset-0 bg-cover bg-center z-0 scale-105 filter blur-[1px] transition-transform duration-1000"
       style="background-image: url('{{ url_for('static', filename='img/admin-bg.jpg') }}');"></div>
  <div class="absolute inset-0 bg-gradient-to-t from-black/85 via-black/60 to-black/75 z-0"></div>

  <!-- Sign In Card -->
  <div class="relative z-10 w-full max-w-sm border border-white/20 bg-white/95 dark:bg-[#1c1613]/95 backdrop-blur-md p-8 shadow-2xl">
    <div class="flex justify-between items-start mb-2">
      <h1 class="text-[22px] font-serif font-semibold text-ink dark:text-white leading-snug">{{ settings.school_name }}</h1>
      <a href="{{ url_for('home') }}" class="text-[11px] font-mono text-brand-red font-bold hover:underline">← Site</a>
    </div>
    <p class="text-[12.5px] text-ink/70 dark:text-white/70 mb-6">Sign in to manage site content.</p>
    {% if error %}
    <div class="admin-error border border-brand-red bg-brand-red/10 text-brand-red px-3 py-2 text-[12px] mb-4 transition-opacity duration-300">{{ error }}</div>
    {% endif %}
    <form method="POST" class="space-y-4">
      <div>
        <label for="username" class="block text-[11px] uppercase tracking-wide opacity-60 mb-1">Username</label>
        <input id="username" name="username" type="text" required autofocus autocomplete="username"
               class="w-full border border-black/15 dark:border-white/20 bg-white/70 dark:bg-black/30 px-3 py-2.5 text-[13px] text-ink dark:text-white focus:outline-none focus:border-brand-red transition-colors">
      </div>
      <div>
        <label for="password" class="block text-[11px] uppercase tracking-wide opacity-60 mb-1">Password</label>
        <input id="password" name="password" type="password" required autocomplete="current-password"
               class="w-full border border-black/15 dark:border-white/20 bg-white/70 dark:bg-black/30 px-3 py-2.5 text-[13px] text-ink dark:text-white focus:outline-none focus:border-brand-red transition-colors">
      </div>
      <button type="submit"
              class="w-full bg-brand-red hover:bg-ink text-white dark:hover:bg-white dark:hover:text-ink py-3 text-[12px] font-bold tracking-widest uppercase transition-colors shadow-md">
        Sign in
      </button>
    </form>
  </div>
  <script src="{{ url_for('static', filename='js/admin.js') }}"></script>
</body>
</html>
