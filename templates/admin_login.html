<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin — {{ settings.school_name }}</title>
<link rel="icon" href="{{ url_for('static', filename='img/' ~ settings.logo) }}">
<script>
  (function () {
    var saved = localStorage.getItem('theme');
    var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
    if (dark) document.documentElement.classList.add('dark');
  })();
</script>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = { darkMode: 'class' };</script>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="min-h-screen flex items-center justify-center bg-[#faf8f6] text-[#141110] dark:bg-[#141110] dark:text-[#f5f0ee]">
<div class="w-full max-w-sm border border-[#e5e0dd] dark:border-[#2c2622] p-8">
  <h1 class="text-[22px] mb-1" style="font-family:'Fraunces',serif;">{{ settings.school_name }} — CMS</h1>
  <p class="text-[12.5px] opacity-60 mb-6">Sign in to manage site content.</p>
  {% if error %}
  <div class="border border-[--red] text-[--red] px-3 py-2 text-[12.5px] mb-4" style="color:var(--red); border-color:var(--red);">{{ error }}</div>
  {% endif %}
  <form method="POST" class="space-y-4">
    <div>
      <label for="password" class="block text-[11px] uppercase tracking-wide opacity-60 mb-1">Password</label>
      <input id="password" name="password" type="password" required autofocus
             class="w-full border border-[#e5e0dd] dark:border-[#2c2622] bg-transparent px-3 py-2 text-[13px] focus:outline-none focus:border-[--red]" style="">
    </div>
    <button type="submit" class="btn primary w-full" style="padding:10px 16px; font-size:12px;">Sign in</button>
  </form>
</div>
</body>
</html>
